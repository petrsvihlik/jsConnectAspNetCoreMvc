name: Build & Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Restore dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore -c Release /p:ContinuousIntegrationBuild=true
      - name: Test
        run: >
          dotnet test
          --no-build
          --verbosity normal
          -c Release
          src/jsConnect.Tests/jsConnect.Tests.csproj
          -p:CollectCoverage=true
          -p:CoverletOutputFormat=opencover
          '-p:Exclude=[xunit.*]*'
          '-p:Include=[jsConnect.*]*'
      - name: Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./src/jsConnect.Tests/coverage.opencover.xml
