name: Publish to NuGet

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Extract version from tag
        id: get_version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Restore dependencies
        run: dotnet restore
      - name: Build
        run: >
          dotnet build
          --no-restore
          -c Release
          /p:ContinuousIntegrationBuild=true
          /p:Version="${{ steps.get_version.outputs.version }}"
      - name: Test
        run: >
          dotnet test
          --no-build
          --verbosity normal
          -c Release
          src/jsConnect.Tests/jsConnect.Tests.csproj
          -p:CollectCoverage=true
          -p:CoverletOutputFormat=opencover
          '-p:Exclude=[xunit.*]*'
          '-p:Include=[jsConnect.*]*'
      - name: Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./src/jsConnect.Tests/coverage.opencover.xml
      - name: Pack
        run: >
          dotnet pack
          --no-build
          --include-symbols
          --verbosity normal
          -c Release
          --output ./artifacts
          src/jsConnect.AspNetCore/jsConnect.AspNetCore.csproj
          /p:PackageVersion="${{ steps.get_version.outputs.version }}"
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NuGet-packages
          path: ./artifacts
      - name: Publish to NuGet.org
        run: dotnet nuget push './artifacts/*.nupkg' -s https://api.nuget.org/v3/index.json -k ${{ secrets.NUGET_API_KEY }} --skip-duplicate
      - name: Attach packages to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" ./artifacts/*.nupkg ./artifacts/*.snupkg --clobber
