name: Publish to NuGet

on:
  release:
    types: [published]
  # Manual (re-)publish of an existing release, e.g. after a failed push.
  # Runs this workflow file from the selected branch but builds the code at the given tag.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish (e.g. 8.0.0)
        required: true
        type: string

permissions:
  contents: write   # gh release upload
  id-token: write   # OIDC token for NuGet trusted publishing

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Extract version from tag
        id: get_version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Restore dependencies
        run: dotnet restore
      - name: Build
        run: >
          dotnet build
          --no-restore
          -c Release
          -p:ContinuousIntegrationBuild=true
          -p:Version=${{ steps.get_version.outputs.version }}
      - name: Test
        run: >
          dotnet test
          --no-build
          -c Release
          --project src/jsConnect.Tests/jsConnect.Tests.csproj
          --results-directory ./coverage
          --coverage
          --coverage-settings src/jsConnect.Tests/CodeCoverage.config
          --coverage-output-format cobertura
          --coverage-output coverage.cobertura.xml
      - name: Check coverage report
        run: python3 .github/scripts/check-coverage.py ./coverage/coverage.cobertura.xml
      - name: Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/coverage.cobertura.xml
          disable_search: true
          fail_ci_if_error: true
      - name: Pack
        run: >
          dotnet pack
          --include-symbols
          --verbosity normal
          -c Release
          --output ./artifacts
          src/jsConnect.AspNetCore/jsConnect.AspNetCore.csproj
          -p:Version=${{ steps.get_version.outputs.version }}
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: NuGet-packages
          path: ./artifacts
      # Trusted publishing: exchange the GitHub OIDC token for a short-lived (1h) nuget.org API key.
      # Requires a trusted publishing policy on nuget.org for this repo + release.yml. No stored secret.
      - name: NuGet login (OIDC)
        id: nuget_login
        uses: NuGet/login@v1
        with:
          user: rocky.intel   # nuget.org profile name of the package owner
      - name: Publish to NuGet.org
        run: dotnet nuget push './artifacts/*.nupkg' -s https://api.nuget.org/v3/index.json -k "$NUGET_API_KEY" --skip-duplicate
        env:
          NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
      - name: Attach packages to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.get_version.outputs.tag }}
        run: gh release upload "$TAG" ./artifacts/*.nupkg ./artifacts/*.snupkg --clobber
