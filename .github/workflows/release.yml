name: Publish to NuGet

on:
  release:
    types: [published]

permissions:
  contents: write   # gh release upload

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Extract version from tag
        id: get_version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Restore dependencies
        run: dotnet restore
      - name: Build
        run: >
          dotnet build
          --no-restore
          -c Release
          -p:ContinuousIntegrationBuild=true
          -p:Version=${{ steps.get_version.outputs.version }}
      - name: Test
        run: >
          dotnet test
          --no-build
          -c Release
          --project src/jsConnect.Tests/jsConnect.Tests.csproj
          --results-directory ./coverage
          --coverage
          --coverage-settings src/jsConnect.Tests/CodeCoverage.config
          --coverage-output-format cobertura
          --coverage-output coverage.cobertura.xml
      - name: Check coverage report
        run: python3 .github/scripts/check-coverage.py ./coverage/coverage.cobertura.xml
      - name: Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/coverage.cobertura.xml
          disable_search: true
          fail_ci_if_error: true
      - name: Pack
        run: >
          dotnet pack
          --include-symbols
          --verbosity normal
          -c Release
          --output ./artifacts
          src/jsConnect.AspNetCore/jsConnect.AspNetCore.csproj
          -p:Version=${{ steps.get_version.outputs.version }}
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: NuGet-packages
          path: ./artifacts
      - name: Publish to NuGet.org
        run: dotnet nuget push './artifacts/*.nupkg' -s https://api.nuget.org/v3/index.json -k ${{ secrets.NUGET_API_KEY }} --skip-duplicate
      - name: Attach packages to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" ./artifacts/*.nupkg ./artifacts/*.snupkg --clobber
